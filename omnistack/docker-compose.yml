services:
  web:
    build:
      context: .
      args:
        # Set NEXT_PUBLIC_SITE_URL in your .env so production URLs bake in.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    volumes:
      # Persist editable content and uploaded media across deploys.
      - ./content:/app/content
      - ./public/uploads:/app/public/uploads

  # Optional: Caddy reverse proxy with automatic HTTPS.
  # Set DOMAIN in your .env (e.g. DOMAIN=omnistack.example.com) and uncomment.
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   depends_on: [web]
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   environment:
  #     - DOMAIN=${DOMAIN:-localhost}
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config

