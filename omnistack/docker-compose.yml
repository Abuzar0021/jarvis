services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    volumes:
      # Persist editable content and uploaded media across deploys.
      - ./content:/app/content
      - ./public/uploads:/app/public/uploads

  # Optional: Caddy reverse proxy with automatic HTTPS.
  # Set DOMAIN in your .env (e.g. DOMAIN=omnistack.example.com) and uncomment.
